version: "3.9"

services:
  app:
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile
    volumes:
      - ..:/workspace:cached
      - maven_cache:/home/vscode/.m2
      - composer_cache:/home/vscode/.cache/composer
      - symfony_cache:/workspace/backend/var
    working_dir: /workspace
    command: sleep infinity
    environment:
      APP_ENV: dev
      SYMFONY_ALLOW_APPDEV: "1"
    ports:
      - "8000:8000" # Symfony local server (optional)
      - "5173:5173" # Frontend dev server if needed

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lila
      POSTGRES_USER: lila
      POSTGRES_PASSWORD: lila
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  maven_cache:
  composer_cache:
  symfony_cache:
  postgres_data:
