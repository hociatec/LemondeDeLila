server {
    listen 80;
    listen [::]:80;
    server_name lilas.hociatec.fr hociatec.fr www.hociatec.fr api.hociatec.fr;

    # Le document root DOIT pointer vers le dossier public de Symfony.
    root /home/ubuntu/lemondeDeLila/backend/public;
    index index.php;

    # Toutes les requêtes sont redirigées vers Symfony (front controller).
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Passage des requêtes PHP au pool PHP-FPM.
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    # Sécurise les fichiers cachés.
    location ~ /\.ht {
        deny all;
    }
}
