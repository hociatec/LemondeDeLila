services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: integration
      MYSQL_DATABASE: lmdl_integration
    ports:
      - "${INTEGRATION_MYSQL_PORT:-33306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pintegration"]
      interval: 2s
      timeout: 2s
      retries: 40
    tmpfs:
      - /var/lib/mysql
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "${INTEGRATION_REDIS_PORT:-36379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 40
