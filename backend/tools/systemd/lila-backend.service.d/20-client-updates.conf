[Service]
# IMPORTANT:
# Do NOT store ClickOnce artifacts inside the git working tree.
# If your deploy does a "git pull" in-place, any published files under backend/data/client-updates/*
# may be overwritten or lost, which can prevent ClickOnce clients from launching/updating.
#
# Point CLIENT_UPDATES_DIR to a persistent directory outside the repo (must be writable by the service user).
Environment=CLIENT_UPDATES_DIR=/var/lib/lemonde-de-lila/client-updates/client-win
Environment=CLIENT_UPDATES_META_PATH=/var/lib/lemonde-de-lila/client-updates/latest.json
Environment=CLIENT_UPDATES_UPLOADS_DIR=/var/lib/lemonde-de-lila/client-updates/uploads
Environment=CLIENT_UPDATES_PUBLIC_URL=https://api.lilas.hociatec.fr/updates/client-win/
# Optional but recommended: keep taverne mirror files out of the git working tree.
Environment=TAVERNE_CATEGORIES_ROOT=/var/lib/lemonde-de-lila/taverne-categories
