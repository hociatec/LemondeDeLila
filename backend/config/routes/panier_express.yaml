panier_express_reference:
    path: /api/games/panier-express/reference
    controller: App\Module\Game\GameCatalogue\JeuxDePlateaux\LesQuatreVents\PanierExpress\Controller\PanierExpressController::reference
    methods: [GET]

panier_express_state:
    path: /api/games/panier-express/rooms/{id}/state{trailingSlash}
    controller: App\Module\Game\GameCatalogue\JeuxDePlateaux\LesQuatreVents\PanierExpress\Controller\PanierExpressGameController::state
    methods: [GET]
    requirements:
        trailingSlash: '/?'
    defaults:
        trailingSlash: ''

panier_express_move:
    path: /api/games/panier-express/rooms/{id}/move{trailingSlash}
    controller: App\Module\Game\GameCatalogue\JeuxDePlateaux\LesQuatreVents\PanierExpress\Controller\PanierExpressGameController::move
    methods: [POST]
    requirements:
        trailingSlash: '/?'
    defaults:
        trailingSlash: ''

panier_express_table_prepare:
    path: /api/games/panier-express/table
    controller: App\Module\Game\GameCatalogue\JeuxDePlateaux\LesQuatreVents\PanierExpress\Controller\PanierExpressTableController::prepare
    methods: [POST]

panier_express_table_add_bot:
    path: /api/games/panier-express/table/{id}/bots
    controller: App\Module\Game\GameCatalogue\JeuxDePlateaux\LesQuatreVents\PanierExpress\Controller\PanierExpressTableController::addBot
    methods: [POST]

panier_express_table_remove_bot:
    path: /api/games/panier-express/table/{id}/bots
    controller: App\Module\Game\GameCatalogue\JeuxDePlateaux\LesQuatreVents\PanierExpress\Controller\PanierExpressTableController::removeBot
    methods: [DELETE]

panier_express_table_launch:
    path: /api/games/panier-express/table/{id}/launch
    controller: App\Module\Game\GameCatalogue\JeuxDePlateaux\LesQuatreVents\PanierExpress\Controller\PanierExpressTableController::launch
    methods: [POST]
