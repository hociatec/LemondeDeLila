doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: false
        mappings:
            AppUser:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Module/User/Entity'
                prefix: 'App\Module\User\Entity'
                alias: User
            AppGame:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Module/Game/Entity'
                prefix: 'App\Module\Game\Entity'
                alias: Game
            AppRules:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Module/Rules/Entity'
                prefix: 'App\Module\Rules\Entity'
                alias: Rules
            AppChat:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Module/Chat/Entity'
                prefix: 'App\Module\Chat\Entity'
                alias: Chat
            AppMessaging:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Module/Messaging/Entity'
                prefix: 'App\Module\Messaging\Entity'
                alias: Messaging
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
