# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.ws.host: '%env(string:APP_WS_HOST)%'
    app.ws.port: '%env(int:APP_WS_PORT)%'
    app.client.version: '%env(string:APP_CLIENT_VERSION)%'
    app.client.download_url: '%env(string:APP_CLIENT_DOWNLOAD_URL)%'
    app.client.checksum: '%env(string:APP_CLIENT_CHECKSUM)%'
    app.client.package_path: '%kernel.project_dir%/%env(string:APP_CLIENT_PACKAGE_PATH)%'
    app.client.download_secret: '%env(string:APP_CLIENT_DOWNLOAD_SECRET)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    _instanceof:
        App\Module\Game\Engine\GameEngineInterface:
            tags: ['app.game_engine']

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Module\User\Api\CustomOpenApiFactory:
        decorates: 'api_platform.openapi.factory'
        arguments: ['@App\Module\User\Api\CustomOpenApiFactory.inner']


    App\Module\Game\Engine\EngineRegistry:
        arguments:
            $engines: !tagged_iterator app.game_engine

    App\Module\Game\Realtime\Command\RealtimeServerCommand:
        tags: ['console.command']

    App\Module\Core\Controller\:
        resource: '../src/Module/Core/Controller'
        tags: ['controller.service_arguments']
        public: true

    App\Module\User\Controller\:
        resource: '../src/Module/User/Controller'
        tags: ['controller.service_arguments']
        public: true

    App\Module\Admin\Controller\:
        resource: '../src/Module/Admin/Controller'
        tags: ['controller.service_arguments']
        public: true

    App\Module\Messaging\Controller\:
        resource: '../src/Module/Messaging/Controller'
        tags: ['controller.service_arguments']
        public: true

    App\Module\Chat\Controller\:
        resource: '../src/Module/Chat/Controller'
        tags: ['controller.service_arguments']
        public: true

    App\Module\Rules\Controller\:
        resource: '../src/Module/Rules/Controller'
        tags: ['controller.service_arguments']
        public: true

    App\Module\Game\Controller\:
        resource: '../src/Module/Game/Controller'
        tags: ['controller.service_arguments']
        public: true

    App\Module\Game\GameCatalogue\JeuxDePlateaux\LesQuatreVents\PanierExpress\Controller\:
        resource: '../src/Module/Game/GameCatalogue/JeuxDePlateaux/LesQuatreVents/PanierExpress/Controller'
        tags: ['controller.service_arguments']
        public: true

    App\Module\Game\GameCatalogue\Actions\VentsInfinis\MissionNemesis\Controller\:
        resource: '../src/Module/Game/GameCatalogue/Actions/VentsInfinis/MissionNemesis/Controller'
        tags: ['controller.service_arguments']
        public: true

    App\Module\Game\GameCatalogue\JeuxDeCartes\VentsDansants\DameNature\Controller\:
        resource: '../src/Module/Game/GameCatalogue/JeuxDeCartes/VentsDansants/DameNature/Controller'
        tags: ['controller.service_arguments']
        public: true
    App\Module\Game\GameCatalogue\JeuxDePlateaux\LesQuatreVents\PanierExpress\Controller\PanierExpressController: ~
    App\Module\Game\GameCatalogue\JeuxDePlateaux\LesQuatreVents\PanierExpress\Controller\PanierExpressGameController: ~
    App\Module\Game\GameCatalogue\JeuxDePlateaux\LesQuatreVents\PanierExpress\Controller\PanierExpressTableController: ~
    App\Module\Game\GameCatalogue\JeuxDePlateaux\LesQuatreVents\PanierExpress\Service\PanierExpressService: ~
    App\Module\Game\GameCatalogue\JeuxDePlateaux\LesQuatreVents\PanierExpress\Service\PanierExpressGameService: ~
    App\Module\Game\GameCatalogue\JeuxDePlateaux\LesQuatreVents\PanierExpress\Service\Support\PanierExpressDeckManager: ~
    App\Module\Game\GameCatalogue\JeuxDePlateaux\LesQuatreVents\PanierExpress\Service\Support\PanierExpressTileResolver: ~
    App\Module\Game\GameCatalogue\JeuxDePlateaux\LesQuatreVents\PanierExpress\Service\Support\NativePanierExpressRandomizer: ~
    App\Module\Game\GameCatalogue\JeuxDePlateaux\LesQuatreVents\PanierExpress\Service\Support\PanierExpressRandomizerInterface: '@App\Module\Game\GameCatalogue\JeuxDePlateaux\LesQuatreVents\PanierExpress\Service\Support\NativePanierExpressRandomizer'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
