name: Release - Client WX + Backend

on:
  # Secours manuel uniquement. Le déploiement normal se fait localement avec
  # `sudo updatecmd all`.
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend_artifact:
    name: Backend - Validate immutable artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Tests and quality contracts
        run: |
          npm run test:cov -- --runInBand
          npm run quality:check
          npm audit --omit=dev --audit-level=high
      - name: Real integration
        run: npm run test:integration:real
      - name: Freeze production artifact
        run: |
          npm prune --omit=dev
          npm run artifact:create -- "$RUNNER_TEMP/backend-deployment.tar.gz"
          npm sbom --omit=dev --sbom-format cyclonedx > "$RUNNER_TEMP/backend-sbom.cdx.json"
      - name: Sign SLSA build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ runner.temp }}/backend-deployment.tar.gz
      - name: Sign CycloneDX SBOM attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ runner.temp }}/backend-deployment.tar.gz
          sbom-path: ${{ runner.temp }}/backend-sbom.cdx.json
      - name: Upload exact validated bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-deployment-${{ github.sha }}
          path: |
            ${{ runner.temp }}/backend-deployment.tar.gz
            ${{ runner.temp }}/backend-deployment.tar.gz.sha256
            ${{ runner.temp }}/backend-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  backend_deploy:
    name: Backend - Content-addressed release
    runs-on: [self-hosted, Linux, X64]
    needs: [backend_artifact]
    steps:
      - name: Download exact validated backend bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-deployment-${{ github.sha }}
          path: ${{ runner.temp }}/backend-deployment
      - name: Guard stale deploy lock
        run: |
          set -euo pipefail
          LOCK=/var/lock/lemonde-deploy.lock
          if sudo test -f "$LOCK"; then
            PID=$(sudo cat "$LOCK" 2>/dev/null || true)
            if [ -n "$PID" ] && sudo kill -0 "$PID" >/dev/null 2>&1; then
              echo "Deploy lock already held by running PID $PID"
              exit 1
            fi
            echo "Removing stale deploy lock left by PID ${PID:-unknown}"
            sudo rm -f "$LOCK"
          fi
      - name: Deploy on server
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/backend-deployment/backend-deployment.tar.gz"
          digest="$(tr -d '\r\n' < "$artifact.sha256")"
          sudo -n /usr/local/sbin/updatecmd backend \
            --artifact "$artifact" \
            --artifact-sha256 "$digest"

  client_wx_publish:
    needs: [backend_deploy]
    uses: ./.github/workflows/client-wx-auto-update.yml
    secrets: inherit
