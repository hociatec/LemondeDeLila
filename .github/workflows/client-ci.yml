name: Client CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify native DLL placeholders
        run: |
          bash java-client/tools/check-native-libs.sh || echo "Native libs manquantes (autorisé en CI)."

      - name: Maven test
        run: mvn -B -pl framework-access,client-app test
