name: Backend - Build & Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: backend-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify Node/npm on runner
        run: |
          set -euo pipefail
          echo "node=$(command -v node)"
          echo "npm=$(command -v npm)"
          node -v
          npm -v

      - name: Guard stale deploy lock
        run: |
          set -euo pipefail
          LOCK=/var/lock/lemonde-deploy.lock
          if sudo test -f "$LOCK"; then
            PID=$(sudo cat "$LOCK" 2>/dev/null || true)
            if [ -n "$PID" ] && sudo kill -0 "$PID" >/dev/null 2>&1; then
              echo "Deploy lock already held by running PID $PID"
              exit 1
            fi
            echo "Removing stale deploy lock left by PID ${PID:-unknown}"
            sudo rm -f "$LOCK"
          fi
      - name: Deploy on server
        run: |
          set -euo pipefail
          NODE_BIN="$(command -v node)"
          NPM_BIN="$(command -v npm)"
          # sudoers may forbid preserving PATH; expose node/npm in secure_path instead.
          sudo ln -sfn "$NODE_BIN" /usr/local/bin/node
          sudo ln -sfn "$NPM_BIN" /usr/local/bin/npm
          sudo /usr/local/sbin/deploy-lemonde-prod
