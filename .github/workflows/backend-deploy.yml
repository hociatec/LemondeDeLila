name: Backend - Build & Deploy

permissions:
  contents: read

on:
  # Secours manuel uniquement. Le déploiement normal se fait localement avec updatecmd.
  workflow_dispatch:

concurrency:
  group: backend-deploy-main
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Full tests with coverage ratchet
        run: npm run test:cov -- --runInBand

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Quality checks
        run: npm run quality:check

      - name: Real MySQL, Redis, BullMQ and two-instance integration
        run: npm run test:integration:real

      - name: Keep production dependencies only
        run: npm prune --omit=dev

      - name: Create content-addressed deployment artifact
        run: |
          npm run artifact:create -- "$RUNNER_TEMP/backend-deployment.tar.gz"
          npm sbom --omit=dev --sbom-format cyclonedx > "$RUNNER_TEMP/backend-sbom.cdx.json"

      - name: Sign SLSA build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ runner.temp }}/backend-deployment.tar.gz

      - name: Sign CycloneDX SBOM attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ runner.temp }}/backend-deployment.tar.gz
          sbom-path: ${{ runner.temp }}/backend-sbom.cdx.json

      - name: Upload the exact validated backend artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-deployment-${{ github.sha }}
          path: |
            ${{ runner.temp }}/backend-deployment.tar.gz
            ${{ runner.temp }}/backend-deployment.tar.gz.sha256
            ${{ runner.temp }}/backend-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: quality
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Download the exact validated backend artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-deployment-${{ github.sha }}
          path: ${{ runner.temp }}/backend-deployment

      - name: Verify Node/npm on runner
        run: |
          set -euo pipefail
          echo "node=$(command -v node)"
          echo "npm=$(command -v npm)"
          node -v
          npm -v

      - name: Deploy on server
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/backend-deployment/backend-deployment.tar.gz"
          digest="$(tr -d '\r\n' < "$artifact.sha256")"
          sudo -n /usr/local/sbin/updatecmd backend \
            --artifact "$artifact" \
            --artifact-sha256 "$digest"

      - name: Verify local deployment health
        env:
          PORT: 3001
        run: |
          set -euo pipefail
          url="http://127.0.0.1:${PORT}/health/info"
          attempts=30
          delay=2
          tmp_json="$(mktemp)"
          cleanup() {
            rm -f "$tmp_json"
          }
          trap cleanup EXIT

          for attempt in $(seq 1 "$attempts"); do
            echo "Checking ${url} (attempt ${attempt}/${attempts})"
            expected="$(tr -d '\r\n' < "$RUNNER_TEMP/backend-deployment/backend-deployment.tar.gz.sha256")"
            if curl -fsS "${url}" -o "$tmp_json" \
              && jq -e --arg expected "$expected" \
                '.build.source == "env" and .build.sha == $expected' "$tmp_json"; then
              jq '{build}' "$tmp_json"
              exit 0
            fi

            if [ "$attempt" -lt "$attempts" ]; then
              sleep "$delay"
            fi
          done

          echo "Backend local unhealthy after $((attempts * delay))s"
          sudo -n systemctl --no-pager --full status lila-backend.service || true
          sudo -n journalctl -u lila-backend.service --no-pager -n 120 || true
          exit 1
