name: Backend - Build & Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: backend-deploy-main
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Transverse tests
        run: npm run test:transverse

      - name: Quality checks
        run: npm run quality:check

  deploy:
    needs: quality
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Verify Node/npm on runner
        run: |
          set -euo pipefail
          echo "node=$(command -v node)"
          echo "npm=$(command -v npm)"
          node -v
          npm -v

      - name: Guard stale deploy lock
        run: |
          set -euo pipefail
          LOCK=/var/lock/lemonde-deploy.lock
          if sudo test -f "$LOCK"; then
            PID=$(sudo cat "$LOCK" 2>/dev/null || true)
            if [ -n "$PID" ] && sudo kill -0 "$PID" >/dev/null 2>&1; then
              echo "Deploy lock already held by running PID $PID"
              exit 1
            fi
            echo "Removing stale deploy lock left by PID ${PID:-unknown}"
            sudo rm -f "$LOCK"
          fi
      - name: Deploy on server
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/deploy-lemonde-prod

      - name: Verify deployed build SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PORT: 3001
        run: |
          set -euo pipefail
          url="http://127.0.0.1:${PORT}/health/info"
          attempts=30
          delay=2
          tmp_json="$(mktemp)"
          cleanup() {
            rm -f "$tmp_json"
          }
          trap cleanup EXIT

          verify_json() {
            node - "$tmp_json" <<'NODE'
          const fs = require("fs");
          const filePath = process.argv[2];
          const expected = (process.env.EXPECTED_SHA || "").trim();
          const raw = fs.readFileSync(filePath, "utf8");
          const parsed = JSON.parse(raw);
          const sha = String(parsed?.build?.sha ?? "").trim();
          console.log("deployed_sha=" + (sha || "(missing)"));
          if (!expected) {
            console.log("expected_sha=(missing) - skipping strict check");
            process.exit(0);
          }
          console.log("expected_sha=" + expected);
          if (!sha) process.exit(2);
          if (sha !== expected) process.exit(3);
          NODE
          }

          for attempt in $(seq 1 "$attempts"); do
            echo "Checking ${url} (attempt ${attempt}/${attempts})"
            if curl -fsS "${url}" -o "$tmp_json" && verify_json; then
              exit 0
            fi

            if [ "$attempt" -lt "$attempts" ]; then
              sleep "$delay"
            fi
          done

          echo "Backend did not expose expected build SHA after $((attempts * delay))s"
          sudo -n systemctl --no-pager --full status lila-backend.service || true
          sudo -n journalctl -u lila-backend.service --no-pager -n 120 || true
          exit 1
