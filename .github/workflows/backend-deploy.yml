name: Backend - Build & Deploy

on:
  # Secours manuel uniquement. Le déploiement normal se fait localement avec updatecmd.
  workflow_dispatch:

concurrency:
  group: backend-deploy-main
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Transverse tests
        run: npm run test:transverse

      - name: Quality checks
        run: npm run quality:check

  deploy:
    needs: quality
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Verify Node/npm on runner
        run: |
          set -euo pipefail
          echo "node=$(command -v node)"
          echo "npm=$(command -v npm)"
          node -v
          npm -v

      - name: Deploy on server
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/updatecmd backend

      - name: Verify local deployment health
        env:
          PORT: 3001
        run: |
          set -euo pipefail
          url="http://127.0.0.1:${PORT}/health/info"
          attempts=30
          delay=2
          tmp_json="$(mktemp)"
          cleanup() {
            rm -f "$tmp_json"
          }
          trap cleanup EXIT

          for attempt in $(seq 1 "$attempts"); do
            echo "Checking ${url} (attempt ${attempt}/${attempts})"
            if curl -fsS "${url}" -o "$tmp_json" \
              && jq -e '.build.source == "env" and (.build.sha | test("^[a-f0-9]{64}$"))' "$tmp_json"; then
              jq '{build}' "$tmp_json"
              exit 0
            fi

            if [ "$attempt" -lt "$attempts" ]; then
              sleep "$delay"
            fi
          done

          echo "Backend local unhealthy after $((attempts * delay))s"
          sudo -n systemctl --no-pager --full status lila-backend.service || true
          sudo -n journalctl -u lila-backend.service --no-pager -n 120 || true
          exit 1
