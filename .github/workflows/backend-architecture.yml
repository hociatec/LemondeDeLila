name: Backend architecture

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    if: ${{ always() }}
    needs: [architecture, real-integration, release-artifact]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all certification jobs to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e "const jobs = JSON.parse(process.env.JOB_RESULTS); if (Object.values(jobs).some(job => job.result !== 'success')) process.exit(1)"

  architecture:
    runs-on: ubuntu-latest
    # The deterministic corpus now covers 120 cases across all 39 games.
    timeout-minutes: 35
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install static analysis dependencies
        run: npm ci --ignore-scripts --include=dev
      - name: Create audit output directory
        run: |
          node -e "require('node:fs').mkdirSync('logs', { recursive: true })"
      - name: Check quality and test regression guards
        run: npm run quality:check
      - name: Compile every game and exercise deterministic replays
        run: npm run typecheck && npm run engine:merge-contracts
      - name: Verify authoring diagnostics and source paths
        run: npm run engine:authoring-contracts
      - name: Check alert behavior with Prometheus
        run: >-
          docker run --rm
          -v "${{ github.workspace }}/backend/observability/prometheus:/rules:ro"
          --entrypoint=/bin/promtool prom/prometheus:v3.5.0
          test rules /rules/lila-alerts.test.yml /rules/lila-slo.test.yml
      - name: Verify alert delivery and resolution on loopback
        run: |
          prometheus_container=$(docker create prom/prometheus:v3.5.0)
          alertmanager_container=$(docker create prom/alertmanager:v0.28.1)
          trap 'docker rm "$prometheus_container" "$alertmanager_container" >/dev/null' EXIT
          docker cp "$prometheus_container:/bin/prometheus" "$RUNNER_TEMP/prometheus"
          docker cp "$alertmanager_container:/bin/alertmanager" "$RUNNER_TEMP/alertmanager"
          chmod +x "$RUNNER_TEMP/prometheus" "$RUNNER_TEMP/alertmanager"
          PROMETHEUS_BINARY="$RUNNER_TEMP/prometheus" ALERTMANAGER_BINARY="$RUNNER_TEMP/alertmanager" npm run test:observability:integration
          PROMETHEUS_BINARY="$RUNNER_TEMP/prometheus" npm run test:metrics:integration
      - name: Enforce zero TypeScript source cycles
        run: npm run cycles:audit
      - name: Check lint rules
        run: npm run lint
      - name: Check runtime cycles and compiler separation
        run: npm run runtime:separation:audit
      - name: Check source layout
        run: npm run layout:audit
      - name: Check application contract ownership
        run: npm run application:contracts:audit
      - name: Check updatecmd deployment contracts
        run: ../tools/updatecmd/tests/main-sync.spec.sh && ../tools/updatecmd/tests/wx-signature-contract.spec.sh

  real-integration:
    needs: architecture
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --include=dev
      - name: Exercise MySQL, Redis, BullMQ and two backend instances
        run: npm run test:integration:real
      - name: Install the locked FFmpeg binary for audio integration tests
        run: npm rebuild ffmpeg-static
      - name: Exercise every application and game regression suite
        run: npm test -- --maxWorkers=2

  release-artifact:
    needs: [architecture, real-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --include=dev
      - name: Reject high-severity production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck and build production code
        run: npm run typecheck:prod && npm run build && npm run verify:dist
      - name: Record game and engine growth independently
        run: |
          mkdir -p logs
          node tools/engine-evolution-report.cjs > logs/engine-evolution.json
      - name: Build the production-only deployment artifact
        run: npm prune --omit=dev && npm rebuild ffmpeg-static && npm run artifact:create -- logs/backend-deployment.tar.gz
        env:
          BACKEND_ARTIFACT_NODE_MAJOR: "24"
      - name: Upload the certified Node 24 deployment artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-deployment-node24-${{ github.sha }}
          path: |
            backend/logs/backend-deployment.tar.gz
            backend/logs/backend-deployment.tar.gz.sha256
            backend/logs/engine-evolution.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
