name: Backend architecture

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-architecture.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-architecture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install static analysis dependencies
        run: npm ci --ignore-scripts --include=dev
      - name: Test architecture guards
        run: npm run architecture:test
      - name: Check application boundaries
        run: npm run architecture:check
      - name: Check runtime cycles and compiler separation
        run: npm run runtime:separation:audit
      - name: Check source layout
        run: npm run layout:audit
