name: Backend incremental certification

on:
  push:
    branches: [main]
    paths: ['backend/**', 'client-wx/**', '.github/workflows/**']
  pull_request:
    paths: ['backend/**', 'client-wx/**', '.github/workflows/**']
  workflow_dispatch:

concurrency:
  group: backend-certification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  impact:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.plan.outputs.backend }}
      architecture: ${{ steps.plan.outputs.architecture }}
      integration: ${{ steps.plan.outputs.integration }}
      release: ${{ steps.plan.outputs.release }}
      all_games: ${{ steps.plan.outputs.all_games }}
      game_ids: ${{ steps.plan.outputs.game_ids }}
      has_games: ${{ steps.plan.outputs.has_games }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - id: plan
        name: Calculate impacted modules and games
        working-directory: backend
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/changed-impact.cjs --base="$BASE_SHA" --head="$HEAD_SHA"

  changed-tests:
    needs: impact
    if: needs.impact.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: backend/package-lock.json }
      - uses: actions/cache@v4
        with:
          path: backend/.cache
          key: backend-test-${{ runner.os }}-${{ hashFiles('backend/package-lock.json', 'backend/tsconfig*.json') }}
      - run: npm ci --ignore-scripts --include=dev
      - name: Prepare optional audio test binary
        run: npm rebuild ffmpeg-static
      - name: Run only related unit and architecture tests
        env:
          CHANGED_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHANGED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run test:changed -- --scope=unit

  static:
    needs: impact
    if: needs.impact.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: backend/package-lock.json }
      - uses: actions/cache@v4
        with:
          path: backend/.cache
          key: backend-static-${{ runner.os }}-${{ hashFiles('backend/package-lock.json', 'backend/tsconfig*.json') }}
      - run: npm ci --ignore-scripts --include=dev
      - run: npm run typecheck && npm run typecheck:prod && npm run lint

  architecture:
    needs: impact
    if: github.event_name != 'pull_request' || needs.impact.outputs.architecture == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci --ignore-scripts --include=dev
      - run: npm run quality:check

  selected-games:
    needs: impact
    if: needs.impact.outputs.has_games == 'true' && needs.impact.outputs.all_games != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci --ignore-scripts --include=dev
      - name: Certify impacted games and smoke replays
        env:
          CHANGED_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHANGED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          GAME_TEST_GAME_IDS: ${{ needs.impact.outputs.game_ids }}
          GAME_TEST_PROFILE: fast
        run: npm run test:changed -- --scope=games

  all-games:
    needs: impact
    if: github.event_name != 'pull_request' || needs.impact.outputs.all_games == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy: { fail-fast: false, matrix: { shard: [1, 2, 3, 4] } }
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci --ignore-scripts --include=dev
      - name: Certify game shard ${{ matrix.shard }}/4
        env: { GAME_TEST_SHARD: '${{ matrix.shard }}/4', GAME_TEST_PROFILE: exhaustive }
        run: |
          npx jest --maxWorkers=2 --shard=${{ matrix.shard }}/4 game/games
          npx jest --runInBand game/testing/architecture-tests/game/all-declarative-games.contract.spec.ts game/testing/architecture-tests/game/reference-replays.spec.ts

  real-integration:
    needs: impact
    if: github.event_name != 'pull_request' || needs.impact.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci --ignore-scripts --include=dev
      - run: npm run test:integration:real

  release-artifact:
    needs: [impact, real-integration]
    if: always() && (github.event_name != 'pull_request' || needs.impact.outputs.release == 'true') && contains(fromJSON('["success","skipped"]'), needs.real-integration.result)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci --ignore-scripts --include=dev
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck:prod && npm run build && npm run verify:dist
      - name: Build the production-only deployment artifact
        env:
          BACKEND_ARTIFACT_NODE_MAJOR: '24'
        run: |
          npm prune --omit=dev
          npm rebuild ffmpeg-static
          npm run artifact:create -- logs/backend-deployment.tar.gz
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v7
        with:
          name: backend-deployment-node24-${{ github.sha }}
          path: |
            backend/logs/backend-deployment.tar.gz
            backend/logs/backend-deployment.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  quality:
    if: always()
    needs: [impact, changed-tests, static, architecture, selected-games, all-games, real-integration, release-artifact]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected certification job to succeed
        env: { JOB_RESULTS: '${{ toJSON(needs) }}' }
        run: node -e "const jobs=JSON.parse(process.env.JOB_RESULTS);if(Object.values(jobs).some(({result})=>!['success','skipped'].includes(result)))process.exit(1)"
