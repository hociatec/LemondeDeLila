name: Client quality

on:
  push:
    branches: [main]
    paths:
      - 'client-wx/**'
      - '.github/workflows/client-quality.yml'
  pull_request:
    paths:
      - 'client-wx/**'
      - '.github/workflows/client-quality.yml'

concurrency:
  group: client-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Portable client checks (maximum two minutes)
        run: timeout 120s bash client-wx/tests/run_portable_checks.sh

  protocol-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated backend/client contracts
        shell: bash
        run: |
          generated_dir="$(mktemp -d)"
          node client-wx/scripts/GenerateProtocolContracts.mjs \
            --backend-root backend \
            --output-root "$generated_dir"
          diff -ru client-wx/src/generated/protocol "$generated_dir"

  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Portable checks with ASan and UBSan
        env:
          CXX: clang++
          LILA_SANITIZERS: address,undefined
        run: timeout 180s bash client-wx/tests/run_portable_checks.sh

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-vcpkg-debug, windows-vcpkg-release]
    steps:
      - uses: actions/checkout@v4
      - name: Initialize MSVC and vcpkg
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VCPKG_INSTALLATION_ROOT)) {
            throw 'VCPKG_INSTALLATION_ROOT is not provided by the Windows runner.'
          }
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - name: Install Ninja
        shell: pwsh
        run: choco install ninja --yes --no-progress
      - uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/client-wx/build
            C:\vcpkg\installed
          key: client-wx-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('client-wx/vcpkg.json', 'client-wx/CMakeLists.txt', 'client-wx/cmake/**') }}
      - name: Configure ${{ matrix.preset }}
        working-directory: client-wx
        run: cmake --preset ${{ matrix.preset }}
      - name: Build ${{ matrix.preset }}
        working-directory: client-wx
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test ${{ matrix.preset }}
        working-directory: client-wx
        run: ctest --preset ${{ matrix.preset }}
      - name: Install Inno Setup
        if: matrix.preset == 'windows-vcpkg-release'
        run: choco install innosetup --yes --no-progress
      - name: Certify portable package and installer
        if: matrix.preset == 'windows-vcpkg-release'
        shell: pwsh
        run: |
          client-wx/tests/Test-WindowsRelease.ps1 `
            -BuildDir client-wx/build/windows-vcpkg-release `
            -WorkDir "${{ runner.temp }}/client release certification" `
            -Version '1.2.651.0' | Tee-Object -FilePath "${{ runner.temp }}/client-release.json"
      - name: Upload certified Windows artifacts
        if: matrix.preset == 'windows-vcpkg-release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-windows-certified
          path: |
            ${{ runner.temp }}/client release certification/release output/*.zip
            ${{ runner.temp }}/client release certification/release output/*.exe
            ${{ runner.temp }}/client-release.json
