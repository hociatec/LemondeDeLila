name: One-time signing secret migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Transfer and verify signing identity
        shell: bash
        env:
          PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          target=/var/lib/lemonde-de-lila/signing-secret-migration
          pfx_tmp="$target/wx-codesign.pfx.tmp.$$"
          password_tmp="$target/wx-codesign-password.tmp.$$"
          ready_tmp="$target/ready.tmp.$$"
          cleanup() {
            shred -u "$pfx_tmp" "$password_tmp" "$ready_tmp" 2>/dev/null || true
          }
          trap cleanup EXIT
          test -d "$target"
          test -n "$PFX_BASE64"
          test -n "$PFX_PASSWORD"
          printf "%s" "$PFX_BASE64" | base64 --decode > "$pfx_tmp"
          test -s "$pfx_tmp"
          actual="$(openssl pkcs12 -in "$pfx_tmp" -passin env:PFX_PASSWORD -clcerts -nokeys 2>/dev/null | openssl x509 -outform DER 2>/dev/null | sha256sum | awk "{print tolower(\$1)}")"
          test "$actual" = "62e99e10aeeaf2445da6763f4524863529ab0e1c9d9af7f5aa0b483e80dabef5"
          printf "%s\n" "$PFX_PASSWORD" > "$password_tmp"
          printf "%s\n" "$actual" > "$ready_tmp"
          mv -f "$pfx_tmp" "$target/wx-codesign.pfx"
          mv -f "$password_tmp" "$target/wx-codesign-password"
          mv -f "$ready_tmp" "$target/ready"
          chmod 0600 "$target/wx-codesign.pfx" "$target/wx-codesign-password" "$target/ready"
          trap - EXIT
          unset PFX_BASE64 PFX_PASSWORD
          echo "Signing identity transferred and verified."
