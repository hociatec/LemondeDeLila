name: Backend Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests with coverage ratchet
        run: npm run test:cov -- --runInBand

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Generate production SBOM
        run: npm sbom --omit=dev --sbom-format cyclonedx > sbom.cdx.json

      - name: Upload production SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-sbom-${{ github.sha }}
          path: backend/sbom.cdx.json
          if-no-files-found: error

      - name: Quality checks
        run: npm run quality:check

      - name: Game-engine performance budget
        env:
          GAME_BENCHMARK_ITERATIONS: 3
          GAME_BENCHMARK_MAX_AVERAGE_MS: 4000
          GAME_BENCHMARK_MAX_P95_MS: 5000
        run: npm run benchmark:game-engine

      - name: Real MySQL, Redis, BullMQ and two-instance integration
        run: npm run test:integration:real
