name: Disaster Recovery Drill

on:
  schedule:
    - cron: "17 3 1 */3 *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Execute isolated MySQL and Redis restore drill
        env:
          DRILL_REPORT_PATH: dr-drill-report.json
        run: npm run test:integration:real
      - name: Archive timed drill evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: disaster-recovery-${{ github.run_id }}
          path: backend/dr-drill-report.json
          if-no-files-found: error
          retention-days: 365
