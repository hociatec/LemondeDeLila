name: Client WX - Build, sign and publish

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - 'client-wx/**'
      - '.github/workflows/client-wx-auto-update.yml'

concurrency:
  group: client-wx-publish-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      VCPKG_BINARY_CACHE: C:\vcpkg-binary-cache
      VCPKG_FEATURE_FLAGS: binarycaching
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC developer shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          $version = "1.2.${{ github.run_number }}"
          "value=$version" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Import Authenticode certificate
        id: certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) { throw 'CODESIGN_PFX_BASE64 absent.' }
          $path = Join-Path $env:RUNNER_TEMP 'lila-codesign.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX_BASE64))
          $password = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $path -Password $password -CertStoreLocation Cert:\CurrentUser\My
          $sha256 = [Convert]::ToHexString(
            [Security.Cryptography.SHA256]::HashData($cert.RawData)
          ).ToLowerInvariant()
          "thumbprint=$($cert.Thumbprint)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha256=$sha256" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: ${{ runner.os }}-vcpkg-client-wx-x64-windows-${{ hashFiles('client-wx/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-client-wx-x64-windows-

      - name: Restore BASS runtime DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'client-wx\third_party\bass\bin\x64\bass.dll'
          if (Test-Path -LiteralPath $target) { return }
          $zip = Join-Path $env:RUNNER_TEMP 'bass24.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'bass24'
          Invoke-WebRequest -Uri 'https://www.un4seen.com/files/bass24.zip' -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $source = Join-Path $extract 'x64\bass.dll'
          if (!(Test-Path -LiteralPath $source)) { throw 'bass.dll x64 absent du paquet Un4seen.' }
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $target) | Out-Null
          Copy-Item -LiteralPath $source -Destination $target -Force

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:VCPKG_INSTALLATION_ROOT
          if ([string]::IsNullOrWhiteSpace($root) -or !(Test-Path -LiteralPath (Join-Path $root 'vcpkg.exe'))) {
            $root = 'C:\vcpkg'
          }
          if (!(Test-Path -LiteralPath (Join-Path $root 'vcpkg.exe'))) {
            $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
            git clone https://github.com/microsoft/vcpkg.git $root
            & (Join-Path $root 'bootstrap-vcpkg.bat')
          }
          New-Item -ItemType Directory -Force -Path $env:VCPKG_BINARY_CACHE | Out-Null
          $env:VCPKG_BINARY_SOURCES = "clear;files,$env:VCPKG_BINARY_CACHE,readwrite"
          & (Join-Path $root 'vcpkg.exe') install wxwidgets nlohmann-json --triplet x64-windows --clean-after-build
          "VCPKG_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Configure and build WX Release
        shell: cmd
        env:
          UPDATE_PUBLIC_KEY: ${{ secrets.LILA_UPDATE_PUBLIC_KEY_DER_BASE64 }}
          UPDATE_SIGNER_SHA256: ${{ steps.certificate.outputs.sha256 }}
        run: |
          if "%UPDATE_PUBLIC_KEY%"=="" exit /b 2
          if "%UPDATE_SIGNER_SHA256%"=="" exit /b 3
          cmake -S client-wx -B client-wx\build\ci-release -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DLILA_PROJECT_VERSION=${{ steps.version.outputs.value }} -DLILA_UPDATE_PUBLIC_KEY_DER_BASE64=%UPDATE_PUBLIC_KEY% -DLILA_UPDATE_AUTHENTICODE_SIGNER_SHA256=%UPDATE_SIGNER_SHA256%
          cmake --build client-wx\build\ci-release --target lemonde_de_lila_wx lila_launcher lemonde_de_lila_wx_update_tests lemonde_de_lila_wx_update_trust_tests --parallel

      - name: Test WX update contracts
        shell: pwsh
        run: |
          ctest --test-dir client-wx\build\ci-release --output-on-failure `
            -R 'lemonde_de_lila_wx_update(_trust)?_tests'

      - name: Sign executables
        shell: pwsh
        env:
          TIMESTAMP_URL: ${{ secrets.CODESIGN_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $timestamp = if ($env:TIMESTAMP_URL) { $env:TIMESTAMP_URL } else { 'http://timestamp.digicert.com' }
          $thumbprint = '${{ steps.certificate.outputs.thumbprint }}'
          $expectedSha256 = '${{ steps.certificate.outputs.sha256 }}'
          signtool sign /sha1 $thumbprint /fd SHA256 /tr $timestamp /td SHA256 client-wx\build\ci-release\lemonde_de_lila_wx.exe
          signtool sign /sha1 $thumbprint /fd SHA256 /tr $timestamp /td SHA256 client-wx\build\ci-release\lila_launcher.exe
          foreach ($file in @('client-wx\build\ci-release\lemonde_de_lila_wx.exe', 'client-wx\build\ci-release\lila_launcher.exe')) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            Write-Host "$file signer subject: $($signature.SignerCertificate.Subject)"
            Write-Host "$file signer issuer: $($signature.SignerCertificate.Issuer)"
            Write-Host "$file signature status: $($signature.Status) $($signature.StatusMessage)"
            if ($signature.Status -notin @('Valid', 'UnknownError')) {
              throw "$file a une signature Authenticode invalide: $($signature.Status)."
            }
            if ($null -eq $signature.SignerCertificate) {
              throw "$file n'a pas de certificat signataire Authenticode."
            }
            if ($signature.SignerCertificate.Thumbprint -ne $thumbprint) {
              throw "$file n'a pas été signé avec le certificat attendu."
            }
            $actualSha256 = [Convert]::ToHexString(
              [Security.Cryptography.SHA256]::HashData($signature.SignerCertificate.RawData)
            ).ToLowerInvariant()
            if ($actualSha256 -ne $expectedSha256) {
              throw "$file n'a pas l'empreinte SHA-256 Authenticode attendue."
            }
            if ($signature.Status -eq 'Valid') {
              signtool verify /pa /tw $file
            } else {
              Write-Warning "$file est signe avec le certificat attendu, mais la chaine n'est pas approuvee par Windows sur le runner."
            }
            Write-Host "$file signé avec $($signature.SignerCertificate.Thumbprint)."
          }

      - name: Package and sign update manifest payload
        id: package
        shell: pwsh
        env:
          PRIVATE_KEY_BASE64: ${{ secrets.LILA_UPDATE_PRIVATE_KEY_PEM_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRIVATE_KEY_BASE64)) { throw 'LILA_UPDATE_PRIVATE_KEY_PEM_BASE64 absent.' }
          $result = client-wx\scripts\PackageWxRelease.ps1 `
            -BuildDir client-wx\build\ci-release `
            -OutputDir $env:RUNNER_TEMP\client-wx-release `
            -Version '${{ steps.version.outputs.value }}' | ConvertFrom-Json
          $key = Join-Path $env:RUNNER_TEMP 'update-private-key.pem'
          [IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:PRIVATE_KEY_BASE64))
          $releaseId = '${{ steps.version.outputs.value }}-${{ github.sha }}'
          $sequence = ([long]'${{ github.run_number }}' * 100) + [long]'${{ github.run_attempt }}'
          $publishedAt = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
          $mandatoryAt = $publishedAt
          $minimumVersion = '${{ steps.version.outputs.value }}'
          $canonical = @(
            'lila-client-wx-manifest-v2'
            'product=client-wx'
            'platform=windows'
            'architecture=x64'
            'channel=stable'
            "releaseId=$releaseId"
            "version=${{ steps.version.outputs.value }}"
            "sequence=$sequence"
            "publishedAt=$publishedAt"
            "mandatoryAt=$mandatoryAt"
            "minimumVersion=$minimumVersion"
            "artifactSize=$($result.Size)"
            "artifactSha256=$($result.Sha256)"
          ) -join "`n"
          $canonicalPath = Join-Path $env:RUNNER_TEMP 'manifest-payload.txt'
          [IO.File]::WriteAllText($canonicalPath, $canonical, [Text.UTF8Encoding]::new($false))
          $signaturePath = Join-Path $env:RUNNER_TEMP 'manifest.sig'
          openssl dgst -sha256 -sign $key -out $signaturePath $canonicalPath
          $signature = [Convert]::ToBase64String([IO.File]::ReadAllBytes($signaturePath))
          "update_zip=$($result.UpdateZip)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "bootstrap_zip=$($result.BootstrapZip)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "payload_dir=$($result.PayloadDir)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha256=$($result.Sha256)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "signature=$signature" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_id=$releaseId" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sequence=$sequence" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "published_at=$publishedAt" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "mandatory_at=$mandatoryAt" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "minimum_version=$minimumVersion" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build and sign WX installer
        id: installer
        shell: pwsh
        env:
          TIMESTAMP_URL: ${{ secrets.CODESIGN_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $result = client-wx\scripts\BuildWxInstaller.ps1 `
            -PayloadDir '${{ steps.package.outputs.payload_dir }}' `
            -OutputDir $env:RUNNER_TEMP\client-wx-installer `
            -Version '${{ steps.version.outputs.value }}' | ConvertFrom-Json
          $timestamp = if ($env:TIMESTAMP_URL) { $env:TIMESTAMP_URL } else { 'http://timestamp.digicert.com' }
          $thumbprint = '${{ steps.certificate.outputs.thumbprint }}'
          signtool sign /sha1 $thumbprint /fd SHA256 /tr $timestamp /td SHA256 $result.InstallerExe
          $signature = Get-AuthenticodeSignature -LiteralPath $result.InstallerExe
          Write-Host "Installer signer subject: $($signature.SignerCertificate.Subject)"
          Write-Host "Installer signer issuer: $($signature.SignerCertificate.Issuer)"
          Write-Host "Installer signature status: $($signature.Status) $($signature.StatusMessage)"
          if ($signature.Status -notin @('Valid', 'UnknownError')) {
            throw "Installateur WX signé invalide: $($signature.Status)."
          }
          if ($signature.Status -eq 'Valid') {
            signtool verify /pa /tw $result.InstallerExe
          } else {
            Write-Warning "Installateur WX signe avec le certificat attendu, mais la chaine n'est pas approuvee par Windows sur le runner."
          }
          "installer_exe=$($result.InstallerExe)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload WX installer
        uses: actions/upload-artifact@v4
        with:
          name: LeMondeDeLilaWX-${{ steps.version.outputs.value }}-Setup
          path: ${{ steps.installer.outputs.installer_exe }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish mandatory WX update
        shell: pwsh
        env:
          API_BASE: ${{ secrets.LILA_API_BASE }}
          UPLOAD_TOKEN: ${{ secrets.LILA_UPLOAD_TOKEN }}
        run: |
          client-wx\scripts\PublishWxUpdate.ps1 `
            -ApiBase $env:API_BASE `
            -UploadToken $env:UPLOAD_TOKEN `
            -PackagePath '${{ steps.package.outputs.update_zip }}' `
            -InstallerPath '${{ steps.installer.outputs.installer_exe }}' `
            -Version '${{ steps.version.outputs.value }}' `
            -ReleaseId '${{ steps.package.outputs.release_id }}' `
            -Sequence '${{ steps.package.outputs.sequence }}' `
            -PublishedAt '${{ steps.package.outputs.published_at }}' `
            -MandatoryAt '${{ steps.package.outputs.mandatory_at }}' `
            -MinimumVersion '${{ steps.package.outputs.minimum_version }}' `
            -Sha256 '${{ steps.package.outputs.sha256 }}' `
            -Signature '${{ steps.package.outputs.signature }}' `
            -Message 'Mise à jour obligatoire du client WX (${{ github.sha }}).'

      - name: Upload initial migration package
        uses: actions/upload-artifact@v4
        with:
          name: LeMondeDeLilaWX-${{ steps.version.outputs.value }}-bootstrap
          path: ${{ steps.package.outputs.bootstrap_zip }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing material
        if: always()
        shell: pwsh
        run: |
          $thumbprint = '${{ steps.certificate.outputs.thumbprint }}'
          if ($thumbprint) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" -Force -ErrorAction SilentlyContinue
          }
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'lila-codesign.pfx') -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'update-private-key.pem') -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'manifest-payload.txt') -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'manifest.sig') -Force -ErrorAction SilentlyContinue
